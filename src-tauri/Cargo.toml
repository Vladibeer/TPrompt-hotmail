[package]
name = "tprompt"
version = "1.0.0"
description = "TPrompt – телепромптър"
authors = ["TPrompt"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
