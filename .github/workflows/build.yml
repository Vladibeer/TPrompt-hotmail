name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install --no-audit --no-fund
      - name: Сглобяване (Tauri)
        run: npm run dist:win
      - name: Събиране на файловете
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: TPrompt-windows
          path: out/*.exe

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - name: Android проект (ако още не е създаден)
        run: test -d android || npx cap add android
      - name: Икони
        run: npx capacitor-assets generate --android
      - name: Синхронизиране на уеб файловете
        run: npm run android:sync
      - name: Сглобяване на APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TPrompt-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Преименуване
        run: |
          cp out/TPrompt-android/app-debug.apk out/TPrompt-${GITHUB_REF_NAME}.apk
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/TPrompt-windows/*.exe
            out/TPrompt-*.apk
